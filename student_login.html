<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - ETE Resource Portal</title>
    <link rel="stylesheet" href="style.css">
    <script src="common.js"></script>
</head>
<body>

    <!-- LOGIN FORM -->
    <section class="login-section">
        <div class="login-container">
            <form class="login-form" onsubmit="handleLogin(event)">
                <h2 class="section-title">Student Login Portal</h2>

                <div class="form-group">
                    <label for="loginName">Full Name *</label>
                    <input type="text" id="loginName" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label for="loginId">Student ID *</label>
                    <input type="text" id="loginId" placeholder="e.g., 22080XX" required>
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password *</label>
                    <input type="password" id="loginPassword" placeholder="Enter your password" required>
                </div>

                <div class="form-group">
                    <label for="loginBatch">Batch/Year *</label>
                    <input type="text" id="loginBatch" placeholder="e.g., 2022" required>
                </div>

                <button type="submit" class="login-btn">Login</button>

                <p class="register-link">Don't have an account? <a href="register.html">Register here</a></p>
                <p><a href="admin_login.html">Admin Login →</a></p>
            </form>
        </div>
    </section>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2026 ETE Department. All Rights Reserved.</p>
    </footer>

    <script>
        // Backend API URL - change this if your backend runs on different port
        const API_URL = 'http://localhost:3000/api';

        async function handleLogin(event) {
            event.preventDefault();

            const name = document.getElementById('loginName').value.trim();
            const id = document.getElementById('loginId').value.trim();
            const password = document.getElementById('loginPassword').value;
            const batch = document.getElementById('loginBatch').value.trim();

            if (!name || !id || !password || !batch) {
                alert('Please fill in all fields');
                return;
            }

            if (password.length < 6) {
                alert('Password must be at least 6 characters');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ id, password })
                });

                const data = await response.json();

                if (data.success && data.user.role === 'student') {
                    // Store login info in localStorage
                    localStorage.setItem('userLoggedIn', 'true');
                    localStorage.setItem('userName', data.user.name);
                    localStorage.setItem('userId', data.user.id);
                    localStorage.setItem('userBatch', data.user.batch);
                    localStorage.setItem('userRole', data.user.role);

                    alert('Student login successful! Redirecting to home page.');
                    window.location.href = 'index.html';
                } else if (data.success && data.user.role === 'admin') {
                    alert('Please use Admin Login page for admin accounts');
                    window.location.href = 'admin_login.html';
                } else {
                    alert(data.message || 'Login failed. Please check your credentials.');
                }
            } catch (error) {
                console.error('Login error:', error);
                alert('Unable to connect to server. Please make sure the backend is running on port 3000.');
            }
        }
    </script>

    <style>
        body {
            background-color: #ffffff;
        }

        .login-section {
            padding: 60px 20px;
            background-color: #ffffff;
        }

        .login-container {
            max-width: 500px;
            margin: 0 auto;
        }

        .login-form {
            background-color: var(--white);
            padding: 40px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .login-form .section-title {
            text-align: center;
            margin-bottom: 10px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            color: var(--primary-blue);
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-group input {
            padding: 14px 16px;
            border: 2px solid var(--light-gray);
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--secondary-blue);
            box-shadow: 0 0 8px rgba(0, 123, 255, 0.2);
        }

        .login-btn {
            background: linear-gradient(135deg, var(--secondary-blue), var(--accent-cyan));
            color: var(--white);
            border: none;
            padding: 16px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 212, 255, 0.4);
        }

        .register-link {
            text-align: center;
            color: var(--text-dark);
            font-size: 14px;
        }

        .register-link a {
            color: var(--secondary-blue);
            text-decoration: none;
            font-weight: 500;
        }

        .register-link a:hover {
            color: var(--accent-cyan);
        }

        p a {
            color: var(--secondary-blue);
            text-decoration: none;
            font-weight: 500;
        }

        p a:hover {
            color: var(--accent-cyan);
        }
    </style>

</body>
</html>
