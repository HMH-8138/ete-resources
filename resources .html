<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resources</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HERO SECTION -->
    <header class="hero">
        <div class="overlay">
            <p class="dept-sub">Faculty of Electrical & Computer Engineering</p>
            <h1 id="resource-title">Resources</h1>
            <p class="tagline">Available materials for your studies</p>
        </div>
    </header>

    <!-- MAIN LAYOUT -->
    <div class="layout">

        <!-- LEFT SIDEBAR -->
        <aside class="sidebar">
            <h3>Quick Links</h3>
            <ul>
                <li><a href="index.html">Back to Levels</a></li>
                <li><a href="term.html">Back to Term Selection</a></li>
            </ul>
        </aside>

        <!-- RIGHT MAIN CONTENT -->
        <main class="container">
            <h2 class="section-title" id="section-title">Resources</h2>
            
            <div class="level-grid term-grid">
                <div class="level-card">
                    <div class="level-header">Books</div>
                    <div class="term-options">
                        <div id="booksList" class="pdf-list"></div>
                        <input type="file" id="booksUpload" accept=".pdf" class="file-input">
                        <label for="booksUpload" class="term-btn upload-btn">+ Upload PDF</label>
                    </div>
                </div>

                <div class="level-card">
                    <div class="level-header">Class Notes</div>
                    <div class="term-options">
                        <div id="notesList" class="pdf-list"></div>
                        <input type="file" id="notesUpload" accept=".pdf" class="file-input">
                        <label for="notesUpload" class="term-btn upload-btn">+ Upload PDF</label>
                    </div>
                </div>

                <div class="level-card">
                    <div class="level-header">Resources</div>
                    <div class="term-options">
                        <div id="resourcesList" class="pdf-list"></div>
                        <input type="file" id="resourcesUpload" accept=".pdf" class="file-input">
                        <label for="resourcesUpload" class="term-btn upload-btn">+ Upload PDF</label>
                    </div>
                </div>

                <div class="level-card">
                    <div class="level-header">Question Papers</div>
                    <div class="term-options">
                        <div id="questionsList" class="pdf-list"></div>
                        <input type="file" id="questionsUpload" accept=".pdf" class="file-input">
                        <label for="questionsUpload" class="term-btn upload-btn">+ Upload PDF</label>
                    </div>
                </div>
            </div>
        </main>

    </div>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2026 ETE Department. All Rights Reserved.</p>
    </footer>

<script>
    const params = new URLSearchParams(window.location.search);
    const type = params.get("type");
    const id = params.get("id");

    const titleText = type === 'course' ? `Course ${id}` : `Lab ${id}`;
    document.getElementById("resource-title").innerText = titleText;
    document.getElementById("section-title").innerText = titleText + " - Resources";

    const storageKey = `resources_${type}_${id}`;

    // Handle file uploads
    ['books', 'notes', 'resources', 'questions'].forEach(resourceType => {
        const fileInput = document.getElementById(resourceType + 'Upload');
        const listDiv = document.getElementById(resourceType + 'List');

        fileInput.addEventListener('change', function() {
            const file = this.files[0];
            if (file && file.type === 'application/pdf') {
                const reader = new FileReader();
                reader.onload = function(e) {
                    let files = JSON.parse(localStorage.getItem(storageKey + '_' + resourceType) || '[]');
                    files.push({
                        name: file.name,
                        data: e.target.result
                    });
                    localStorage.setItem(storageKey + '_' + resourceType, JSON.stringify(files));
                    displayPDFs(resourceType, listDiv);
                    fileInput.value = '';
                };
                reader.readAsDataURL(file);
            } else {
                alert('Please upload a PDF file');
            }
        });

        // Display stored PDFs
        displayPDFs(resourceType, listDiv);
    });

    function displayPDFs(resourceType, listDiv) {
        const files = JSON.parse(localStorage.getItem(storageKey + '_' + resourceType) || '[]');
        listDiv.innerHTML = '';
        files.forEach((file, index) => {
            const item = document.createElement('div');
            item.className = 'pdf-item';
            item.innerHTML = `
                <a href="${file.data}" download="${file.name}" class="pdf-link">📄 ${file.name}</a>
                <button class="delete-btn" onclick="deletePDF('${resourceType}', ${index})">✕</button>
            `;
            listDiv.appendChild(item);
        });
    }

    window.deletePDF = function(resourceType, index) {
        let files = JSON.parse(localStorage.getItem(storageKey + '_' + resourceType) || '[]');
        files.splice(index, 1);
        localStorage.setItem(storageKey + '_' + resourceType, JSON.stringify(files));
        const listDiv = document.getElementById(resourceType + 'List');
        displayPDFs(resourceType, listDiv);
    };
</script>

</body>
</html>
