<script>
    // Dynamically show Level and Term in hero
    const params = new URLSearchParams(window.location.search);
    const level = params.get("level");
    const term = params.get("term");

    document.getElementById("term-title").innerText =
        `Level ${level} – Term ${term}`;

    // Save course code changes
    document.querySelectorAll('.course-code-input').forEach(input => {
        input.addEventListener('blur', function() {
            const courseId = this.getAttribute('data-id');
            localStorage.setItem(`course_${courseId}`, this.value);
        });

        // Load saved course code
        const courseId = input.getAttribute('data-id');
        const saved = localStorage.getItem(`course_${courseId}`);
        if (saved) {
            input.value = saved;
        }
    });
</script>
