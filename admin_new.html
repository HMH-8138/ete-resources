 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - ETE Resource Portal</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 3px solid var(--primary-blue);
        }
        
        .admin-header h1 {
            color: var(--primary-blue);
            font-size: 32px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, var(--primary-blue), var(--secondary-blue));
            color: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
        }
        
        .stat-card h3 {
            font-size: 36px;
            margin-bottom: 5px;
        }
        
        .stat-card p {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .stat-card.pending {
            background: linear-gradient(135deg, #f39c12, #e67e22);
        }
        
        .stat-card.approved {
            background: linear-gradient(135deg, #27ae60, #2ecc71);
        }
        
        .stat-card.rejected {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .tab-btn {
            padding: 12px 24px;
            background: var(--light-gray);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .tab-btn.active {
            background: var(--primary-blue);
            color: white;
        }
        
        .resource-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-left: 4px solid var(--primary-blue);
        }
        
        .resource-card.pending {
            border-left-color: #f39c12;
        }
        
        .resource-card.approved {
            border-left-color: #27ae60;
        }
        
        .resource-card.rejected {
            border-left-color: #e74c3c;
        }
        
        .resource-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }
        
        .resource-title {
            font-size: 18px;
            color: var(--primary-blue);
            font-weight: 600;
        }
        
        .status-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .status-badge.pending {
            background: #fef3cd;
            color: #856404;
        }
        
        .status-badge.approved {
            background: #d4edda;
            color: #155724;
        }
        
        .status-badge.rejected {
            background: #f8d7da;
            color: #721c24;
        }
        
        .resource-details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 15px;
        }
        
        .detail-item {
            display: flex;
            flex-direction: column;
        }
        
        .detail-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 3px;
        }
        
        .detail-value {
            font-size: 14px;
            color: var(--text-dark);
            font-weight: 500;
        }
        
        .resource-description {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
            color: #555;
        }
        
        .review-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .review-comment {
            flex: 1;
            padding: 10px;
            border: 2px solid var(--light-gray);
            border-radius: 6px;
            font-size: 14px;
        }
        
        .btn-approve {
            background: #27ae60;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .btn-approve:hover {
            background: #219a52;
            transform: translateY(-2px);
        }
        
        .btn-reject {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .btn-reject:hover {
            background: #c0392b;
            transform: translateY(-2px);
        }
        
        .btn-view {
            background: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }
        
                .btn-view:hover {
                    background: #2980b9;
                    transform: translateY(-2px);
                }
                
                .btn-delete {
                    background: #e74c3c;
                    color: white;
                    border: none;
                    padding: 10px 20px;
                    border-radius: 6px;
                    cursor: pointer;
                    font-weight: 600;
                    transition: all 0.3s;
                }
                
                .btn-delete:hover {
                    background: #c0392b;
                    transform: translateY(-2px);
                }
        
        .review-info {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--light-gray);
            font-size: 13px;
            color: #666;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }
        
        .empty-state h3 {
            color: var(--primary-blue);
            margin-bottom: 10px;
        }
        
        .filter-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            align-items: center;
        }
        
        .filter-bar select {
            padding: 10px 15px;
            border: 2px solid var(--light-gray);
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }
        
        .filter-bar label {
            font-weight: 600;
            color: var(--primary-blue);
        }
    </style>
</head>
<body>

    <!-- NAVIGATION BAR -->
    <nav class="navbar">
        <div class="nav-container">
            <ul class="nav-menu">
                <li class="nav-item"><a href="index.html" class="nav-link">Home</a></li>
                <li class="nav-item"><a href="admin_new.html" class="nav-link">Admin</a></li>
            </ul>
        </div>
    </nav>

    <!-- HERO SECTION -->
    <header class="hero">
        <div class="overlay">
            <p class="dept-sub">Faculty of Electrical & Computer Engineering</p>
            <h1>Admin Dashboard</h1>
            <p class="tagline">Review and manage uploaded resources</p>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <div class="admin-container">
        <div class="admin-header">
            <h1>Resource Review Dashboard</h1>
            <button onclick="loadResources()" class="back-btn">Refresh</button>
        </div>

        <!-- Statistics -->
        <div class="stats-grid">
            <div class="stat-card">
                <h3 id="totalCount">0</h3>
                <p>Total Uploads</p>
            </div>
            <div class="stat-card pending">
                <h3 id="pendingCount">0</h3>
                <p>Pending Review</p>
            </div>
            <div class="stat-card approved">
                <h3 id="approvedCount">0</h3>
                <p>Approved</p>
            </div>
            <div class="stat-card rejected">
                <h3 id="rejectedCount">0</h3>
                <p>Rejected</p>
            </div>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" onclick="showTab('pending')">Pending Review</button>
            <button class="tab-btn" onclick="showTab('all')">All Resources</button>
            <button class="tab-btn" onclick="showTab('approved')">Approved</button>
            <button class="tab-btn" onclick="showTab('rejected')">Rejected</button>
        </div>

        <!-- Filter Bar -->
        <div class="filter-bar">
            <label>Filter by Course:</label>
            <select id="courseFilter" onchange="applyFilter()">
                <option value="">All Courses</option>
            </select>
            <label>Filter by Resource Type:</label>
            <select id="typeFilter" onchange="applyFilter()">
                <option value="">All Types</option>
                <option value="books">Books</option>
                <option value="questions">Question Papers</option>
                <option value="notes">Class Notes</option>
                <option value="resources">Resources</option>
            </select>
        </div>

        <!-- Resources Container -->
        <div id="resourcesContainer">
            <div class="empty-state">
                <h3>Loading resources...</h3>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer>
        <p>2026 ETE Department. All Rights Reserved.</p>
    </footer>

    <script>
        // Backend API URL
        const API_URL = 'http://localhost:3000/api';
        
        // Current tab
        let currentTab = 'pending';
        let allResources = [];
        
        // Initialize
        window.addEventListener('load', () => {
            loadResources();
        });

        async function loadResources() {
            try {
                const response = await fetch(`${API_URL}/admin/all-resources`);
                const result = await response.json();
                
                if (result.success) {
                    allResources = result.data;
                    updateStats();
                    populateCourseFilter();
                    renderResources();
                }
            } catch (error) {
                console.error('Error loading resources:', error);
                document.getElementById('resourcesContainer').innerHTML = `
                    <div class="empty-state">
                        <h3>Error loading resources</h3>
                        <p>Make sure the backend server is running on port 3000</p>
                    </div>
                `;
            }
        }

        function updateStats() {
            document.getElementById('totalCount').textContent = allResources.length;
            document.getElementById('pendingCount').textContent = allResources.filter(r => r.status === 'pending').length;
            document.getElementById('approvedCount').textContent = allResources.filter(r => r.status === 'approved').length;
            document.getElementById('rejectedCount').textContent = allResources.filter(r => r.status === 'rejected').length;
        }

        function populateCourseFilter() {
            const courses = [...new Set(allResources.map(r => r.courseCode))];
            const select = document.getElementById('courseFilter');
            select.innerHTML = '<option value="">All Courses</option>';
            courses.forEach(course => {
                const option = document.createElement('option');
                option.value = course;
                option.textContent = course;
                select.appendChild(option);
            });
        }

        function showTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            renderResources();
        }

        function applyFilter() {
            renderResources();
        }

        function getFilteredResources() {
            let filtered = [...allResources];
            
            if (currentTab === 'pending') {
                filtered = filtered.filter(r => r.status === 'pending');
            } else if (currentTab === 'approved') {
                filtered = filtered.filter(r => r.status === 'approved');
            } else if (currentTab === 'rejected') {
                filtered = filtered.filter(r => r.status === 'rejected');
            }
            
            const courseFilter = document.getElementById('courseFilter').value;
            if (courseFilter) {
                filtered = filtered.filter(r => r.courseCode === courseFilter);
            }
            
            const typeFilter = document.getElementById('typeFilter').value;
            if (typeFilter) {
                filtered = filtered.filter(r => r.resourceType === typeFilter);
            }
            
            return filtered;
        }

        function renderResources() {
            const container = document.getElementById('resourcesContainer');
            const resources = getFilteredResources();
            
            if (resources.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>No resources found</h3>
                        <p>${currentTab === 'pending' ? 'No pending resources to review.' : 'No resources match the selected filters.'}</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = resources.map(resource => {
                const resourceTypeLabels = {
                    'books': 'Books',
                    'questions': 'Question Papers',
                    'notes': 'Class Notes',
                    'resources': 'Resources'
                };
                
                const uploadedDate = new Date(resource.uploadedAt).toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
                
                // View PDF button - shows if file exists (for admin to review)
const viewButton = (resource.file && resource.file.filename) 
                    ? `<a href="http://localhost:3000/uploads/${resource.file.filename}" target="_blank" class="btn-view">View PDF</a>` 
                    : '';
                
                // Delete button - only for admin
                const deleteButton = `<button class="btn-delete" onclick="deleteResource(${resource.id})">Delete</button>`;
                
                const reviewedInfo = resource.status !== 'pending' ? `
                    <div class="review-info">
                        <strong>Reviewed:</strong> ${resource.reviewedAt ? new Date(resource.reviewedAt).toLocaleDateString() : 'N/A'} 
                        by ${resource.adminId || 'Admin'}
                        ${resource.reviewComment ? `<br><strong>Comment:</strong> ${resource.reviewComment}` : ''}
                    </div>
                ` : '';
                
                const actionButtons = resource.status === 'pending' ? `
                    <div class="review-actions">
                        ${viewButton}
                        ${deleteButton}
                        <input type="text" class="review-comment" id="comment-${resource.id}" placeholder="Add comment (optional)">
                        <button class="btn-approve" onclick="approveResource(${resource.id})">Approve</button>
                        <button class="btn-reject" onclick="rejectResource(${resource.id})">Reject</button>
                    </div>
                ` : '';
                
                // For approved/rejected resources, also show delete option for admin
                const adminActions = resource.status !== 'pending' ? `
                    <div class="review-actions" style="margin-top: 10px;">
                        ${viewButton}
                        ${deleteButton}
                    </div>
                ` : '';
                
                return `
                    <div class="resource-card ${resource.status}">
                        <div class="resource-header">
                            <div class="resource-title">${resource.fileTitle}</div>
                            <span class="status-badge ${resource.status}">${resource.status}</span>
                        </div>
                        <div class="resource-details">
                            <div class="detail-item">
                                <span class="detail-label">Course</span>
                                <span class="detail-value">${resource.courseCode}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Level/Term</span>
                                <span class="detail-value">Level ${resource.level} - Term ${resource.term}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Resource Type</span>
                                <span class="detail-value">${resourceTypeLabels[resource.resourceType] || resource.resourceType}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Uploaded By</span>
                                <span class="detail-value">${resource.userName}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Batch</span>
                                <span class="detail-value">${resource.batch || 'N/A'}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Upload Date</span>
                                <span class="detail-value">${uploadedDate}</span>
                            </div>
                        </div>
                        ${resource.description ? `<div class="resource-description"><strong>Description:</strong> ${resource.description}</div>` : ''}
                        ${actionButtons}
                        ${adminActions}
                        ${reviewedInfo}
                    </div>
                `;
            }).join('');
        }

        async function approveResource(resourceId) {
            const comment = document.getElementById(`comment-${resourceId}`).value;
            
            try {
                const response = await fetch(`${API_URL}/admin/review-resource`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        resourceId: resourceId,
                        status: 'approved',
                        reviewComment: comment,
                        adminId: 'admin'
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    alert('Resource approved successfully!');
                    loadResources();
                } else {
                    alert('Error: ' + result.message);
                }
            } catch (error) {
                console.error('Error approving resource:', error);
                alert('Failed to connect to server');
            }
        }

        async function rejectResource(resourceId) {
            const comment = document.getElementById(`comment-${resourceId}`).value;
            
            if (!comment) {
                alert('Please provide a reason for rejection');
                return;
            }
            
            try {
                const response = await fetch(`${API_URL}/admin/review-resource`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        resourceId: resourceId,
                        status: 'rejected',
                        reviewComment: comment,
                        adminId: 'admin'
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    alert('Resource rejected');
                    loadResources();
                } else {
                    alert('Error: ' + result.message);
                }
            } catch (error) {
                console.error('Error rejecting resource:', error);
                alert('Failed to connect to server');
            }
        }

        async function deleteResource(resourceId) {
            if (!confirm('Are you sure you want to delete this resource? This action cannot be undone.')) {
                return;
            }
            
            try {
                const response = await fetch(`${API_URL}/admin/delete-resource/${resourceId}`, {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const result = await response.json();
                
                if (result.success) {
                    alert('Resource deleted successfully!');
                    loadResources();
                } else {
                    alert('Error: ' + result.message);
                }
            } catch (error) {
                console.error('Error deleting resource:', error);
                alert('Failed to connect to server');
            }
        }
    </script>
</body>
</html>
