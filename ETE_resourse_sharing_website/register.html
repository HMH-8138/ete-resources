<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - ETE Resource Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- REGISTER FORM -->
    <section class="register-section">
        <div class="register-container">
            <form class="register-form" onsubmit="handleRegister(event)">
                <h2 class="section-title">Student Registration</h2>

                <div class="form-row">
                    <div class="form-group">
                        <label for="regName">Full Name *</label>
                        <input type="text" id="regName" placeholder="Enter your full name" required>
                    </div>
                    <div class="form-group">
                        <label for="regEmail">Email *</label>
                        <input type="email" id="regEmail" placeholder="Enter your email" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="regId">Student ID *</label>
                    <input type="text" id="regId" placeholder="e.g., 22080XX" required>
                </div>

                <div class="form-group">
                    <label for="regBatch">Batch/Year *</label>
                    <input type="text" id="regBatch" placeholder="e.g., 2022" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="regPassword">Password *</label>
                        <input type="password" id="regPassword" placeholder="Create a password (min 6 characters)" required>
                    </div>
                    <div class="form-group">
                        <label for="regConfirmPassword">Confirm Password *</label>
                        <input type="password" id="regConfirmPassword" placeholder="Confirm your password" required>
                    </div>
                </div>

                <div class="form-group checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="regTerms" required>
                        I agree to the <a href="#" target="_blank">Terms and Conditions</a> and <a href="#" target="_blank">Privacy Policy</a>
                    </label>
                </div>

                <button type="submit" class="register-btn">Register</button>

                <p class="login-link">Already have an account? <a href="student_login.html">Student Login</a></p>
            </form>
        </div>
    </section>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2026 ETE Department. All Rights Reserved.</p>
    </footer>

    <script>
        // Backend API URL - change this if your backend runs on different port
        const API_URL = 'https://ete-resources.onrender.com/api';

        async function handleRegister(event) {
            event.preventDefault();

            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const id = document.getElementById('regId').value.trim();
            const batch = document.getElementById('regBatch').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;
            const terms = document.getElementById('regTerms').checked;

            if (!name || !email || !id || !batch || !password || !confirmPassword) {
                alert('Please fill in all required fields');
                return;
            }

            if (password !== confirmPassword) {
                alert('Passwords do not match');
                return;
            }

            if (password.length < 6) {
                alert('Password must be at least 6 characters');
                return;
            }

            if (!terms) {
                alert('Please agree to the Terms and Conditions');
                return;
            }

            // Simple email validation
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                alert('Please enter a valid email address');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        name,
                        email,
                        id,
                        batch,
                        password
                    })
                });

                const data = await response.json();

                if (data.success) {
                    alert('Registration successful! Please wait for admin approval before logging in.');
                    window.location.href = 'login.html';
                } else {
                    alert(data.message || 'Registration failed. Please try again.');
                }
            } catch (error) {
                console.error('Registration error:', error);
                alert('Unable to connect to server. Please make sure the backend is running on port 3000.');
            }
        }
    </script>

    <style>
        body {
            background-color: #ffffff;
        }

        .register-section {
            padding: 40px 20px;
            background-color: #ffffff;
        }

        .register-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .register-form {
            background-color: var(--white);
            padding: 40px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .register-form .section-title {
            text-align: center;
            margin-bottom: 10px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            color: var(--primary-blue);
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 12px 16px;
            border: 2px solid var(--light-gray);
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--secondary-blue);
            box-shadow: 0 0 8px rgba(0, 123, 255, 0.2);
        }

        .checkbox-group {
            margin-top: 10px;
        }

        .checkbox-label {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            font-size: 14px;
            color: var(--text-dark);
        }

        .checkbox-label input[type="checkbox"] {
            margin-top: 2px;
            width: auto;
        }

        .checkbox-label a {
            color: var(--secondary-blue);
            text-decoration: none;
        }

        .checkbox-label a:hover {
            color: var(--accent-cyan);
        }

        .register-btn {
            background: linear-gradient(135deg, var(--secondary-blue), var(--accent-cyan));
            color: var(--white);
            border: none;
            padding: 16px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .register-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 212, 255, 0.4);
        }

        .login-link {
            text-align: center;
            color: var(--text-dark);
            font-size: 14px;
        }

        .login-link a {
            color: var(--secondary-blue);
            text-decoration: none;
            font-weight: 500;
        }

        .login-link a:hover {
            color: var(--accent-cyan);
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>

</body>
</html>
