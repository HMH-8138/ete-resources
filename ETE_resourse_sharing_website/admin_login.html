<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - ETE Resource Portal</title>
    <link rel="stylesheet" href="style.css">
    <script src="common.js"></script>
</head>
<body>

    <!-- LOGIN FORM -->
    <section class="login-section">
        <div class="login-container">
            <div style="text-align: center; margin-bottom: 20px;">
                <a href="student_login.html" style="color: var(--secondary-blue); font-size: 14px;">← Student Login</a>
            </div>
            <form class="login-form" onsubmit="handleAdminLogin(event)">
                <h2 class="section-title">Admin Login Portal</h2>

                <!-- Credentials hidden -->

                <div class="form-group">
                    <label for="adminId">Admin ID *</label>
                    <input type="text" id="adminId" placeholder="meherab" required>
                </div>

                <div class="form-group">
                    <label for="adminPassword">Password *</label>
                    <input type="password" id="adminPassword" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="login-btn" style="background: linear-gradient(135deg, #27ae60, #2ecc71);">Admin Login</button>
            </form>
        </div>
    </section>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2026 ETE Department. All Rights Reserved.</p>
    </footer>

    <script>
        // Backend API URL
        const API_URL = 'http://localhost:3000/api';

        async function handleAdminLogin(event) {
            event.preventDefault();

            const id = document.getElementById('adminId').value.trim();
            const password = document.getElementById('adminPassword').value;

            if (!id || !password) {
                alert('Please fill in all fields');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ id, password })
                });

                const data = await response.json();

                if (data.success && data.user.role === 'admin') {
                    localStorage.setItem('userLoggedIn', 'true');
                    localStorage.setItem('userName', data.user.name);
                    localStorage.setItem('userId', data.user.id);
                    localStorage.setItem('userRole', 'admin');
                    alert('Admin login successful!');
                    window.location.href = 'admin_new.html';
                } else {
                    alert('Invalid admin credentials');
                }
            } catch (error) {
                alert('Server error. Backend on port 3000?');
            }
        }
    </script>

    <style>
        .login-section { padding: 60px 20px; }
        .login-container { max-width: 500px; margin: 0 auto; }
        .login-form { background: var(--white); padding: 40px; border-radius: 12px; box-shadow: var(--shadow); gap: 25px; }
        .section-title { text-align: center; }
        .form-group label { color: var(--primary-blue); font-weight: 600; margin-bottom: 8px; }
        .form-group input { padding: 14px; border: 2px solid var(--light-gray); border-radius: 8px; }
        .login-btn { background: linear-gradient(135deg, #27ae60, #2ecc71); color: white; border: none; padding: 16px; border-radius: 8px; font-size: 18px; font-weight: 600; cursor: pointer; }
        .login-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(39, 174, 96, 0.4); }
    </style>

</body>
</html>
